name: Problema
description: Algo não funciona como deveria na Game Library.
title: "[Problema] "
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por avisar! Antes de enviar, confira *Configurações › Diagnóstico do vault* e a seção [Problemas comuns](https://github.com/Lemysz/game-library/blob/main/DOCUMENTACAO.md#problemas-comuns).
        **Nunca cole chaves, tokens, Web API Keys ou senhas aqui.**
  - type: input
    id: versao
    attributes:
      label: Versão da Game Library
      description: Aparece em Configurações, abaixo do título.
      placeholder: "1.0.0 · Prototype"
    validations:
      required: true
  - type: dropdown
    id: aparelho
    attributes:
      label: Onde acontece
      multiple: true
      options:
        - Celular (Android)
        - Celular (iPhone)
        - Tablet
        - Computador
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Tela ou área
      options:
        - Início
        - Biblioteca
        - Ficha do jogo
        - Conquistas
        - Estatísticas
        - Integrações (Steam, RetroAchievements, Xbox, GOG…)
        - Plataformas, gêneros, subgêneros ou franquias
        - Coleções
        - Outra
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra…
        2. Toque em…
  - type: textarea
    id: imagens
    attributes:
      label: Capturas de tela
      description: Arraste as imagens para cá (esconda dados pessoais, se houver).
