name: Versões

# Cria a versão no GitHub quando uma tag vX.Y.Z[-estágio] é enviada:
#   git tag v1.1.0 && git push origin v1.1.0   (com estágio: v1.2.0-beta)
# ou pelo botão "Run workflow" (Actions › Versões), escolhendo o branch: aí a
# tag é criada pelo próprio GitHub no commit do branch. Nos dois casos a tag
# precisa bater com a VERSION/STAGE do código e com uma seção do CHANGELOG.
# A versão nasce como pré-lançamento enquanto o estágio não for estável. Como o
# repositório é privado, a versão e o ZIP também são privados.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão (ex.: v1.1.0, ou v1.2.0-beta com estágio); criada no commit do branch se ainda não existir"
        required: true

permissions:
  contents: write

jobs:
  versao:
    name: Publicar versão
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Conferir tag e versão do código
        id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VER=$(grep -oP 'this\.VERSION\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' Scripts/SteamVaultCore.js)
          STAGE=$(grep -oP 'this\.STAGE\s*=\s*"\K[A-Za-z0-9-]*' Scripts/SteamVaultCore.js || true)
          EXPECTED="v$VER${STAGE:+-$(echo "$STAGE" | tr '[:upper:]' '[:lower:]')}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::A tag $TAG não corresponde à versão do código ($EXPECTED)."
            exit 1
          fi
          awk -v v="## [$VER]" 'index($0, v) == 1 { f = 1 } END { exit !f }' CHANGELOG.md || { echo "::error::CHANGELOG.md sem a seção [$VER]."; exit 1; }
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verificações rápidas
        working-directory: .github/tests
        run: |
          npm ci --ignore-scripts
          node checks.js

      - name: Montar o ZIP instalável e as notas
        env:
          VER: ${{ steps.v.outputs.ver }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          NAME="Game_Library_${TAG#v}"
          # só arquivos versionados; .gitattributes (export-ignore) tira testes e arquivos do GitHub
          git archive --format=zip -o "$NAME.zip" --prefix=Game_Library/ HEAD
          # conferência: nada de código de terceiros, segredos ou estado local no ZIP
          if unzip -Z1 "$NAME.zip" | grep -E '^Game_Library/(\.obsidian/plugins/[^/]+/(main\.js|styles\.css|manifest\.json)|\.obsidian/themes/|\.obsidian/workspace[^/]*\.json|\.trash/|Backups/|\.steamvault/|\.github/(tests|tools|workflows)/|(.*/)?\.env(\..*)?$|(.*/)?node_modules/)'; then
            echo "::error::O ZIP contém arquivos que não podem ser distribuídos."; exit 1
          fi
          # Dataview e CustomJS entram prontos (versão fixa, SHA-256 conferido, licença MIT);
          # nenhum outro código de plugin pode estar no ZIP
          bash .github/tools/bundle-plugins.sh "$NAME.zip"
          if unzip -Z1 "$NAME.zip" | grep -E '^Game_Library/\.obsidian/plugins/[^/]+/(main\.js|styles\.css|manifest\.json)$' | grep -vE '^Game_Library/\.obsidian/plugins/(dataview|customjs)/'; then
            echo "::error::O ZIP contém código de plugin fora da lista permitida."; exit 1
          fi
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          # notas: seção "## [VER]" do CHANGELOG.md até a próxima seção
          awk -v v="## [$VER]" 'index($0, v) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          # links relativos do CHANGELOG viram endereços do repositório (na página da versão eles quebrariam)
          BASE="https://github.com/$GITHUB_REPOSITORY"
          sed -i -E "s#\]\(\.\./\.\./#](${BASE}/#g; s#\]\(([^):#][^):]*)\)#](${BASE}/blob/${TAG}/\1)#g" notes.md
          {
            echo
            echo "---"
            echo "### Como instalar"
            echo "1. Baixe \`$NAME.zip\` abaixo e descompacte."
            echo "2. No Obsidian, *Abrir pasta como vault* → \`Game_Library\`, e confie no vault."
            echo "3. Os plugins obrigatórios (**Dataview** e **CustomJS**) já vêm no ZIP, ativados: não é preciso instalar nada. Opcionais: **Style Settings** (ajustes visuais) e **Templater** (para usar os modelos em \`_Templates/\`), pela loja de plugins."
            echo "4. Abra \`Dashboard/Home\`. Detalhes no README."
          } >> notes.md
          echo "name=$NAME" >> "$GITHUB_ENV"

      - name: Criar a versão no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.ver }}
          STAGE: ${{ steps.v.outputs.stage }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          PRE=""
          [ -n "$STAGE" ] && PRE="--prerelease"
          # push de tag: a tag já existe; botão manual: o GitHub cria a tag no commit do branch
          VERIFY=""
          [ "$GITHUB_EVENT_NAME" = "push" ] && VERIFY="--verify-tag"
          if [ "$GITHUB_EVENT_NAME" != "push" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            AT=$(git ls-remote --tags origin "refs/tags/$TAG^{}" "refs/tags/$TAG" | cut -f1)
            echo "$AT" | grep -qx "$GITHUB_SHA" || { echo "::error::A tag $TAG já existe em outro commit."; exit 1; }
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$name.zip" "$name.zip.sha256" --clobber
          else
            gh release create "$TAG" "$name.zip" "$name.zip.sha256" \
              $VERIFY --target "$GITHUB_SHA" \
              --title "Game Library $VER${STAGE:+ — $STAGE}" \
              --notes-file notes.md $PRE
          fi
