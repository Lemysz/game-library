name: Testes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Verificações, telas e testes funcionais
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .github/tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/tests/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificações rápidas (sintaxe, CSS, versão, notas, segredos, higiene)
        run: node checks.js

      - name: Ícones (SVGs em Assets/Icons em dia com o registro e XML válido)
        run: node icons.js

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Abrir todas as telas no celular e no computador
        run: node smoke.js
        env:
          SV_SHOTS: screenshots

      - name: Testes funcionais (filtros, janelas, fila, sessão, gravação nas notas)
        run: node functional.js

      - name: Guardar as capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: .github/tests/screenshots
          retention-days: 7
          if-no-files-found: ignore

  responsivo:
    name: Responsividade (${{ matrix.tema }}) — 320, 360, 390, 430 px e desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tema: [dark, light]
    defaults:
      run:
        working-directory: .github/tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/tests/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Todas as telas em 320, 360, 390, 430 px e desktop
        run: node responsive.js
        env:
          SV_THEMES: ${{ matrix.tema }}
