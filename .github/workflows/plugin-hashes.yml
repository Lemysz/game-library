name: Hashes dos plugins opcionais (temporário)

# Roda uma vez para levantar versão, SHA-256 e licença do Templater e do Style
# Settings no release oficial. Grava o resultado no próprio branch para revisão.
# Será apagado logo depois.
on:
  push:
    branches: [ccr-060a11f9-lsz16q]
    paths: [.github/workflows/plugin-hashes.yml]

permissions:
  contents: write

jobs:
  hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-060a11f9-lsz16q
      - name: Baixar e medir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=.github/plugins/novos.lock.txt
          : > "$out"
          for pair in "templater-obsidian SilentVoid13/Templater" "obsidian-style-settings mgmeyers/obsidian-style-settings"; do
            set -- $pair; id=$1; repo=$2
            tag="$(gh api "repos/$repo/releases/latest" --jq .tag_name)"
            spdx="$(gh api "repos/$repo/license" --jq .license.spdx_id)"
            echo "# $id $tag licença $spdx" >> "$out"
            for f in manifest.json main.js styles.css; do
              if curl -sSfL --retry 3 -o "/tmp/$id-$f" "https://github.com/$repo/releases/download/$tag/$f"; then
                echo "$id $tag $repo $f $(sha256sum "/tmp/$id-$f" | cut -c1-64)" >> "$out"
              else
                echo "# $id $tag: sem $f no release" >> "$out"
              fi
            done
            grep -o '"id": *"[^"]*"\|"version": *"[^"]*"\|"minAppVersion": *"[^"]*"\|"isDesktopOnly": *[a-z]*' "/tmp/$id-manifest.json" | sed "s/^/# $id manifest: /" >> "$out"
            gh api "repos/$repo/license" --jq .content | base64 -d > ".github/plugins/$id.LICENSE.txt"
          done
          cat "$out"
      - name: Gravar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/plugins
          git commit -m "Hashes e licenças do Templater e do Style Settings (gerado)"
          git push
