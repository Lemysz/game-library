<!doctype html><html lang="pt-BR"><head>
<!-- Simulação mínima do Obsidian (app, Dataview, CustomJS) para os testes automáticos. Não é usada pelo vault. -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="obsidian-defaults.css"><link rel="stylesheet" href="vault/.obsidian/snippets/steamvault.css">

<script src="data.js"></script><script src="js-yaml.min.js"></script></head>
<body class="theme-dark is-mobile">
<div class="workspace-leaf mod-active"><div class="workspace-leaf-content"><div class="view-content"><div class="markdown-preview-view"><div id="host"></div></div></div></div></div>
<script>
window.__errors=[];window.addEventListener("error",e=>__errors.push(String(e.message)));window.addEventListener("unhandledrejection",e=>__errors.push("rej:"+String(e.reason&&e.reason.stack||e.reason)));
const origWarn=console.warn,origErr=console.error;console.error=(...a)=>{__errors.push("console.error:"+a.map(String).join(" "));origErr(...a)};
const byPath=new Map(__PAGES.map(p=>[p.path,p]));const fileSet=new Set(__FILES);
const mkFile=p=>{const name=p.split("/").pop();const i=name.lastIndexOf(".");return{path:p,name,basename:i>0?name.slice(0,i):name,extension:i>0?name.slice(i+1):"",stat:{mtime:0,ctime:0,size:0},parent:{path:p.split("/").slice(0,-1).join("/")}}};
const dvPage=p=>({...p.fm,file:{path:p.path,name:p.path.split("/").pop().replace(/\.md$/,""),folder:p.path.split("/").slice(0,-1).join("/")}});
let curPath="Dashboard/Home.md";
const resolve=link=>{let l=String(link).replace(/^\[\[|\]\]$/g,"");if(byPath.has(l))return l;if(byPath.has(l+".md"))return l+".md";const b=l.split("/").pop();for(const p of byPath.keys()){if(p.split("/").pop().replace(/\.md$/,"")===b)return p;}for(const f of __FILES){if(f===l||f.endsWith("/"+l))return f;}return null;};
window.app={vault:{getAbstractFileByPath:p=>fileSet.has(p)?mkFile(p):null,getResourcePath:f=>(window.__blobs&&__blobs[f.path])||"vault/"+f.path.split("/").map(encodeURIComponent).join("/"),getMarkdownFiles:()=>__FILES.filter(f=>f.endsWith(".md")).map(mkFile),on:()=>({}),offref(){},adapter:{exists:async p=>(window.__fs||(window.__fs={}))[p]!==undefined,read:async p=>{const f=window.__fs||{};if(f[p]!==undefined)return f[p];if(/^Assets\/i18n\/.+\.json$/.test(p)){const r=await fetch("vault/"+p.split("/").map(encodeURIComponent).join("/"));if(r.ok)return r.text();}return "{}"},write:async(p,t)=>{(window.__fs||(window.__fs={}))[p]=t},remove:async p=>{delete (window.__fs||{})[p]},mkdir:async p=>{(window.__fs||(window.__fs={}))[p]=""},list:async()=>({files:[],folders:[]})},createFolder:async()=>{},create:async(path,text)=>{const m=/^---\n([\s\S]*?)\n---/.exec(text);const fm=m?jsyaml.load(m[1],{schema:jsyaml.JSON_SCHEMA}):{};const r=/(?:render\(dv,\s*|page:\s*)"([\w-]+)"/.exec(text);const pg={fm,path,page:r?r[1]:null};__PAGES.push(pg);byPath.set(path,pg);fileSet.add(path);__FILES.push(path);window.__created=(window.__created||[]).concat(path);return mkFile(path);},createBinary:async(path,buf)=>{fileSet.add(path);__FILES.push(path);window.__bin=(window.__bin||{});__bin[path]=buf.byteLength;window.__blobs=window.__blobs||{};__blobs[path]=URL.createObjectURL(new Blob([buf]));return mkFile(path);},modifyBinary:async(f,buf)=>{window.__bin=(window.__bin||{});__bin[f.path]=buf.byteLength;},modify:async()=>{},readBinary:async f=>(window.__bin&&window.__blobs&&__blobs[f.path])?await (await fetch(__blobs[f.path])).arrayBuffer():await (await fetch("vault/"+f.path.split("/").map(encodeURIComponent).join("/"))).arrayBuffer(),getFiles:()=>__FILES.map(mkFile),read:async()=>"",cachedRead:async()=>""},
metadataCache:{fileToLinktext:(f,src,omit)=>{const n=String(f.path).replace(/\.md$/,"");const base=n.split("/").pop();return __FILES.filter(x=>x.replace(/\.md$/,"").split("/").pop()===base).length>1?n:base;},on:()=>({}),getFileCache:f=>({frontmatter:byPath.get(f.path)?.fm}),getFirstLinkpathDest:(l)=>{const r=resolve(l);return r?mkFile(r):null}},
workspace:{on:()=>({}),openLinkText:(l)=>{const r=resolve(l);if(r)go(r)},getActiveFile:()=>mkFile(curPath),leftSplit:{}},
fileManager:{trashFile:async f=>{const i=__PAGES.findIndex(x=>x.path===f.path);if(i>=0)__PAGES.splice(i,1);byPath.delete(f.path);fileSet.delete(f.path);const j=__FILES.indexOf(f.path);if(j>=0)__FILES.splice(j,1);window.__trashed=(window.__trashed||[]).concat(f.path);setTimeout(()=>rerender(),400)},processFrontMatter:async(f,fn)=>{const p=byPath.get(f.path);fn(p.fm);window.__fmWrites=(window.__fmWrites||0)+1;setTimeout(()=>{customJS.SteamVaultCore?.invalidate?.();rerender()},400)}},commands:{executeCommandById:()=>false}};
window.requestUrl=async(o)=>{const u=o.url||o;window.__lastHeaders=o.headers||{};window.__lastReq=o;window.__reqs=(window.__reqs||[]).concat(u);
 if(/steamstatic\.com/.test(u)&&!window.__noCdn){const logo=/logo\.png$/.test(u);if(/_2x/.test(u))return{status:404,headers:{},arrayBuffer:new ArrayBuffer(0)};const src=logo?"vault/Assets/Achievements/Celeste/Respire.jpg":/library_hero/.test(u)?"vault/Assets/Featured/Resident Evil 2-destaque.webp":"vault/Assets/Covers/Dying Light.jpg";const b=await (await fetch(src)).arrayBuffer();return{status:200,headers:{"content-type":logo?"image/png":/library_hero/.test(u)?"image/webp":"image/jpeg"},arrayBuffer:b,text:""};}
 if(window.__mockReq){const r=await window.__mockReq(u);if(r)return r;}
 return{status:404,headers:{},text:"",arrayBuffer:new ArrayBuffer(0)};};window.moment=undefined;window.__ls={};app.loadLocalStorage=k=>__ls[k]??null;app.saveLocalStorage=(k,v)=>{if(v===null||v===undefined)delete __ls[k];else __ls[k]=v};
window.customJS={};
async function loadScripts(){const names=window.__SCRIPTS;
for(const n of names){const t=await (await fetch("vault/Scripts/"+n+".js")).text();try{customJS[n]=new (new Function(t+"\nreturn "+n+";")())();}catch(e){__errors.push("load "+n+": "+e.message)}}}
function mkdv(){const host=document.getElementById("host");const wrap=a=>({array:()=>a,where:f=>wrap(a.filter(f)),filter:f=>wrap(a.filter(f)),map:f=>a.map(f),length:a.length,[Symbol.iterator]:()=>a[Symbol.iterator]()});return{container:host,pages:()=>wrap(__PAGES.map(dvPage)),page:x=>{const r=resolve(x);return r?dvPage(byPath.get(r)):null},current:()=>dvPage(byPath.get(curPath))}}
async function go(p){curPath=p;const pg=byPath.get(p)?.page||"home";window.__navs=(window.__navs||0)+1;await customJS.SteamVault.render(mkdv(),pg);}
async function rerender(){customJS.SteamVaultCore.invalidate?.();await customJS.SteamVault.render(mkdv(),byPath.get(curPath)?.page||"home");window.__rerenders=(window.__rerenders||0)+1}
window.go=go;window.rerender=rerender;
loadScripts().then(()=>go(new URLSearchParams(location.search).get("p")||"Dashboard/Home.md")).then(()=>window.__ready=true).catch(e=>{__errors.push("boot:"+e.stack);window.__ready=true});
</script></body></html>
